name: CI - QA Tests & Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pruebas Automatizadas y Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar navegador Chromium y dependencias del sistema operativo
        run: |
          playwright install --with-deps chromium

      - name: Ejecutar suite de pruebas completa y generar reporte de cobertura
        run: |
          pytest -v --cov=app --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-report=term

      - name: Publicar reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-html
          path: htmlcov/
          retention-days: 14

      - name: Publicar capturas de pantalla de fallos E2E
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capturas-fallos-e2e
          path: tests/e2e/screenshots/
          retention-days: 7
